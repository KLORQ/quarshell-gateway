# Control plane: quarshell-gateway.
#
# Local token-authenticated Gateway:
#   docker compose -f quarshell-gateway/compose/docker-compose.yml up -d --build
#   QUARSHELL_TOKEN must be set in the environment or ignored .env file.
#
# Local control plane: durable SQLite state and required bearer-token auth.

services:
  quarshell-gateway:
    build:
      context: ../..
      dockerfile: quarshell-gateway/Dockerfile
    image: quarshell-gateway:local
    ports:
      - "${CAUTEM_GATEWAY_BIND_IP:-127.0.0.1}:${CAUTEM_GATEWAY_PORT:-7443}:7443"
      - "${CAUTEM_GATEWAY_BIND_IP:-127.0.0.1}:${CAUTEM_GRPC_PORT:-7445}:7444"
    command:
      - --listen
      - 0.0.0.0:7443
      - --grpc-listen
      - 0.0.0.0:7444
      - --data
      - /var/lib/openshell/state.db
      - --runtime
      - docker
    volumes:
      - quarshell-gateway-data:/var/lib/openshell
    environment:
      QUARSHELL_TOKEN: ${QUARSHELL_TOKEN:?Set QUARSHELL_TOKEN in the environment or compose .env file}
    restart: unless-stopped
    # OpenShell Linux parity: sandbox/sidecar callback via host-gateway aliases.
    extra_hosts:
      - "host.cautem.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    networks: [cautem]
  # Retained UI preview; its OIDC flow is not integrated with this Gateway yet.
  quarshell-ui:
    profiles: ["ui"]
    build:
      context: ../..
      dockerfile: quarshell-ui/Dockerfile
      args:
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-quarshell-ui}
    image: quarshell-ui:local
    ports:
      - "127.0.0.1:${QUARSHELL_UI_PORT:-7444}:8080"
    environment:
      CAUTEM_GATEWAY_UPSTREAM: ${CAUTEM_GATEWAY_UPSTREAM:-quarshell-gateway:7443}
    depends_on:
      - quarshell-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cautem]
    restart: unless-stopped
  # Optional IdP for local OIDC login (profile: oidc).
  dex:
    profiles: ["oidc"]
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    networks: [cautem]
    restart: unless-stopped
  postgres-tools:
    profiles: ["maintenance"]
    image: mirror.gcr.io/library/postgres:17.10-alpine3.23@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    entrypoint: ["/usr/local/bin/postgres-backup-client.sh"]
    environment:
      OPENSHELL_DB_URL: ${OPENSHELL_DB_URL:-}
    volumes:
      - ./postgres-backup-client.sh:/usr/local/bin/postgres-backup-client.sh:ro
    networks: [cautem]
    restart: "no"

networks:
  cautem:
    driver: bridge

volumes:
  quarshell-gateway-data:
