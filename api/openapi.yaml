openapi: 3.1.0
info:
  title: quarshell Gateway REST API
  version: 0.1.0
  summary: Health and authentication bootstrap.
  description: >-
    Management APIs use the pinned OpenShell Gateway RPC contract. Rootfs
    staging uses the OpenShell RPC and its gateway-local path.
    Streaming SSH and supervisor relay transports are not REST APIs.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:7443
    description: Local development gateway. Configure HTTPS for remote use.
tags:
  - name: Health
    description: Liveness checks for the gateway process.
  - name: Gateway
    description: Browser and OIDC authentication bootstrap.
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Health]
      summary: Check gateway liveness
      security: []
      responses:
        '200':
          description: Gateway is live.
        '405':
          description: Method not allowed.
  /auth/oidc-config:
    get:
      operationId: getOIDCConfiguration
      tags: [Gateway]
      summary: Read OpenShell OIDC configuration
      security: []
      responses:
        '200':
          description: OIDC configuration. Available only when OIDC is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCConfiguration'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/connect:
    get:
      operationId: connectGatewayFromBrowser
      tags: [Gateway]
      summary: Complete edge-proxy authentication for a local CLI session
      security: []
      parameters:
        - name: callback_port
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 65535
        - name: code
          in: query
          required: true
          description: One-time confirmation code displayed by the CLI.
          schema:
            type: string
            pattern: '^[A-Z2-9]{3}-[A-Z2-9]{4}$'
      responses:
        '200':
          description: HTML confirmation page or waiting page.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid callback port or confirmation code.
        '405':
          description: Method not allowed.
components:
  schemas:
    OIDCConfiguration:
      type: object
      required: [issuer, audience]
      properties:
        issuer:
          type: string
          format: uri
        audience:
          type: string
  responses:
    NotFound:
      description: Resource not found. Current response body is text/plain.
      content:
        text/plain:
          schema:
            type: string
