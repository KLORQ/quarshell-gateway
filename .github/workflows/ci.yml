name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  api-contract:
    name: API contracts
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: quarshell-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          path: quarshell-gateway
          fetch-depth: 0
      - name: Checkout quarshell-proto
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI document
        run: npx --yes @redocly/cli@2.60.0 lint api/openapi.yaml --config api/redocly.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            quarshell-gateway/go.sum
            quarshell-proto/go.sum
      - name: Install pinned Buf CLI
        run: go install github.com/bufbuild/buf/cmd/buf@v1.66.0
      - name: Lint and regenerate Control API
        working-directory: quarshell-proto
        run: |
          buf lint
          buf breaking --against schema/control-5e20fa2f6943.binpb
          buf generate --template buf.gen.yaml
          if [[ -n "$(git status --porcelain -- gen/go)" ]]; then
            echo "generated Control API code is stale"
            git status --short -- gen/go
            exit 1
          fi
      - name: Build generated TypeScript client
        run: |
          npm ci --prefix ../quarshell-proto/typescript
          npm run check --prefix ../quarshell-proto/typescript
          if [[ -n "$(git -C ../quarshell-proto status --porcelain -- typescript/src/gen)" ]]; then
            echo "generated TypeScript client is stale"
            git -C ../quarshell-proto status --short -- typescript/src/gen
            exit 1
          fi
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Validate Kubernetes deployment chart
        run: |
          helm lint packaging/helm/cautem
          helm template shared-server packaging/helm/cautem \
            --set database.existingSecret=shared-postgres-credentials >/dev/null
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quarshell-gateway
    steps:

      - name: Checkout quarshell-gateway
        uses: actions/checkout@v4
        with:
          path: quarshell-gateway

      - name: Checkout quarshell-proto
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto

      - name: Checkout quarshell-cli
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-cli
          ref: v0.1.2
          path: quarshell-cli

      - name: Checkout quarshell-core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.4.2
          path: quarshell-core

      - name: Checkout quarshell-providers
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-providers
          ref: v0.1.1
          path: quarshell-providers

      - name: Checkout quarshell-runtime
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-runtime
          ref: v0.1.1
          path: quarshell-runtime

      - name: Checkout quarshell-driver
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-driver
          ref: v0.1.1
          path: quarshell-driver

      - name: Checkout quarshell-proxy
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.1
          path: quarshell-proxy

      - name: Checkout quarshell-slogx
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-slogx
          ref: v0.1.5
          path: quarshell-slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("$d")
            done
            for d in "${modules[@]}"; do
              echo "  ./$d"
            done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

