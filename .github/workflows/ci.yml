          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: PostgreSQL registry integration
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CAUTEM_TEST_POSTGRES_URL: postgres://postgres:cautem-ci@127.0.0.1:55432/cautem_test?sslmode=disable
        run: |
          set -euo pipefail
          container="quarshell-gateway-postgres-${GITHUB_RUN_ID}"
          docker run --detach --rm --name "$container" \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=cautem-ci \
            --env POSTGRES_DB=cautem_test \
            mirror.gcr.io/library/postgres:17.10-alpine3.23@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready --host=127.0.0.1 --username=postgres --dbname=cautem_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$container" pg_isready --host=127.0.0.1 --username=postgres --dbname=cautem_test
          CGO_ENABLED=1 go test -race -count=1 ./internal/storage/store ./internal/httpapi \
            -run '^(TestOpenPostgresImportsPersistsAndLocksInstallation|TestNewHandlerReleasesPostgresLockOnContextCancel)$'
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./quarshell-gateway/coverage.txt
          flags: unittests
          name: codecov-quarshell-gateway
          fail_ci_if_error: false
